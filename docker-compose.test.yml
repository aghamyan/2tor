# Standalone compose file for CI/integration tests — intentionally does not
# extend or depend on docker-compose.yml. `docker compose -f
# docker-compose.test.yml up` brings up only an isolated test database, on
# its own port and volume, so it can run alongside the main dev stack (or in
# CI, where the main stack usually isn't running at all) without conflict.
name: 2tor-test

services:
  db_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-app_test}
    ports:
      # localhost-only, same as the primary postgres service.
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    read_only: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_TEST_USER:-postgres} -d ${POSTGRES_TEST_DB:-app_test}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata_test:
