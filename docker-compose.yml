name: 2tor

# `docker compose up` (no profile) starts only the four infra services named
# in the infra task this file was scoped to: postgres, redis, minio, caddy.
# `docker compose --profile app up` additionally builds and runs web/worker.
# Keeping app builds off the default path means a broken app build can never
# block the infra services from coming up healthy.

x-restart-policy: &restart_policy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart_policy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # localhost-only: never bind 0.0.0.0, Postgres must not be reachable
      # from outside this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]

  redis:
    image: redis:7-alpine
    <<: *restart_policy
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-changeme-redis-password}",
        "--appendonly",
        "yes",
      ]
    user: redis
    ports:
      # localhost-only, same reasoning as postgres above.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    tmpfs:
      - /tmp
    read_only: true
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-changeme-redis-password} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [data]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    <<: *restart_policy
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio-password}
    ports:
      # localhost-only: the API/console are for local debugging (mc, the
      # browser console); app containers reach MinIO over the `data` network
      # using the `minio` service hostname, never through these bindings.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]

  # One-shot job: creates the app's bucket and leaves it private (no
  # anonymous/public read or write policy). Exits after running.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-app-uploads}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc anonymous set none "local/$$MINIO_BUCKET"
    restart: "no"
    networks: [data]

  caddy:
    image: caddy:2-alpine
    <<: *restart_policy
    ports:
      # The only service allowed to publish to all interfaces — it's the
      # single public entry point; everything else is localhost-only or
      # unpublished.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
      WEB_PORT: ${WEB_PORT:-3000}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Hits Caddy's own internal responder (docker/Caddyfile's :2019 block),
      # not the web upstream — so this stays healthy even when web/worker
      # aren't running (they're behind the "app" profile).
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [edge]

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    <<: *restart_policy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3000}
      # Override the host-facing values from .env with the internal service
      # hostnames containers actually reach each other by.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme-redis-password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MINIO_BUCKET:-app-uploads}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme-minio-password}
      S3_FORCE_PATH_STYLE: "true"
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [edge, data]

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    <<: *restart_policy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme-redis-password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MINIO_BUCKET:-app-uploads}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme-minio-password}
      S3_FORCE_PATH_STYLE: "true"
    read_only: true
    tmpfs:
      - /tmp
    # No healthcheck: apps/worker/src/index.ts is currently a stub (`export
    # {}`) with no long-running consumer loop, so there's no "is it up" check
    # to run yet. Add one (e.g. a BullMQ/Redis connectivity check) once the
    # worker actually does something.
    networks: [data]

networks:
  # Caddy + web only — Caddy can never reach postgres/redis/minio directly,
  # even over the internal Docker network.
  edge:
  # postgres/redis/minio/minio-init/web/worker — the app's private backend.
  data:

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
