packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  argon2: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

# Single dependency-manifest strategy: every version used anywhere in the
# workspace is pinned exactly once here. Individual package.json files
# reference "catalog:" instead of a version range, so bumping a dependency
# is a one-line change in this file, never a hunt across packages.
catalog:
  # --- framework ---
  next: ^16.2.12
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

  # --- language & build tooling ---
  typescript: ^5.9.3
  "@types/node": ^26.1.2
  tsx: ^4.23.1
  turbo: ^2.10.7

  # --- lint & format ---
  # Pinned to the 9.x line (not latest 10.x): eslint-plugin-react (pulled in
  # transitively by eslint-config-next) still calls the removed context.getFilename()
  # API and throws under ESLint 10. Revisit once eslint-plugin-react ships a fix.
  eslint: ^9.39.5
  "@eslint/js": ^9.39.5
  typescript-eslint: ^8.65.0
  eslint-config-next: ^16.2.12
  globals: ^17.8.0
  prettier: ^3.9.6

  # --- data layer ---
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  postgres: ^3.4.9

  # --- queue / cache ---
  ioredis: ^5.11.1
  bullmq: ^5.81.2

  # --- validation & forms ---
  zod: ^4.4.3
  react-hook-form: ^7.83.0
  "@hookform/resolvers": ^5.5.7

  # --- i18n ---
  next-intl: ^4.13.4

  # --- ui ---
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  lucide-react: ^1.27.0
  framer-motion: ^12.43.0
  shadcn: ^4.16.0
  "@radix-ui/react-slot": ^1.3.3
  "@radix-ui/react-dialog": ^1.1.23
  "@radix-ui/react-dropdown-menu": ^2.1.24
  "@radix-ui/react-label": ^2.1.15
  "@radix-ui/react-select": ^2.3.7
  "@radix-ui/react-separator": ^1.1.15
  "@radix-ui/react-tabs": ^1.1.21
  "@radix-ui/react-tooltip": ^1.2.16
  "@radix-ui/react-avatar": ^1.2.6
  "@radix-ui/react-checkbox": ^1.3.11
  "@radix-ui/react-popover": ^1.1.23
  "@radix-ui/react-switch": ^1.3.7
  "@radix-ui/react-toast": ^1.2.23

  # --- rich text & math rendering (MathOverflow question/answer bodies) ---
  # Markdown is rendered via the remark/rehype AST — no dangerouslySetInnerHTML on raw user
  # input. rehype-sanitize strips any disallowed node as defense in depth even though
  # react-markdown never parses embedded raw HTML by default.
  katex: ^0.18.1
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  remark-math: ^6.0.0
  rehype-katex: ^7.0.1
  rehype-sanitize: ^6.0.0

  # --- payments & infra clients ---
  "@aws-sdk/client-s3": ^3.1096.0
  ulid: ^3.0.2
  argon2: ^0.45.1

  # --- proctoring / on-device vision ---
  # Client-side-only face landmark detection for assessment proctoring (packages/domain/assessments
  # "Camera boundary"). Runs entirely in the browser via WASM; no video frame ever leaves the device.
  "@mediapipe/tasks-vision": ^1.0.1

  # --- observability ---
  "@sentry/nextjs": ^10.68.0
  pino: ^10.3.1

  # --- testing ---
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10
  playwright: ^1.62.0
  "@playwright/test": ^1.62.0
  testcontainers: ^12.0.4

minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1000.21"
  - "@aws-sdk/client-s3@3.1096.0"
  - "@aws-sdk/credential-provider-env@3.972.62"
  - "@aws-sdk/credential-provider-http@3.972.64"
  - "@aws-sdk/credential-provider-ini@3.973.7"
  - "@aws-sdk/credential-provider-login@3.972.69"
  - "@aws-sdk/credential-provider-node@3.972.73"
  - "@aws-sdk/credential-provider-process@3.972.62"
  - "@aws-sdk/credential-provider-sso@3.973.6"
  - "@aws-sdk/credential-provider-web-identity@3.972.68"
  - "@aws-sdk/middleware-sdk-s3@3.972.67"
  - "@aws-sdk/nested-clients@3.997.36"
  - "@aws-sdk/token-providers@3.1096.0"
  - "@types/node@26.1.2"
  - shadcn@4.16.0
